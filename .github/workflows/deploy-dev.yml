name: Deploy dev

on:
  push:
    branches: [main]
    paths:
      - 'infra/terraform/**'
      - '.github/workflows/deploy-dev.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  terraform-apply:
    name: Terraform apply (dev)
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/485487171043/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: gha-deployer@arcos-hasfy-dev.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform init
        working-directory: infra/terraform/envs/dev
        run: terraform init -input=false

      - name: terraform apply
        working-directory: infra/terraform/envs/dev
        run: terraform apply -input=false -auto-approve
