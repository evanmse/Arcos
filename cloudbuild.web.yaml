steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - apps/web/Dockerfile
      - -t
      - europe-west1-docker.pkg.dev/$PROJECT_ID/integreat-docker/web:$_TAG
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - europe-west1-docker.pkg.dev/$PROJECT_ID/integreat-docker/web:$_TAG
substitutions:
  _TAG: v0.1.1
images:
  - europe-west1-docker.pkg.dev/$PROJECT_ID/integreat-docker/web:$_TAG
options:
  logging: CLOUD_LOGGING_ONLY
