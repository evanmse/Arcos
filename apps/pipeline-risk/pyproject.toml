[project]
name = "integreat-pipeline-risk"
version = "0.1.0"
description = "INTEGREAT — Legal corpus ingestion pipeline (EUR-Lex → Vector Search + Postgres + Neo4j)"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "tenacity>=9.0",
    "beautifulsoup4>=4.12",
    "lxml>=5.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "google-cloud-storage>=2.18",
    "google-cloud-aiplatform>=1.71",
    "google-cloud-pubsub>=2.26",
    "google-cloud-secret-manager>=2.20",
    "google-auth>=2.35",
    "vertexai>=1.71",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "neo4j>=5.26",
    "python-ulid>=3.0",
    "tiktoken>=0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.24",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-beautifulsoup4",
]

[project.scripts]
ingest-corpus = "pipeline_risk.jobs.ingest_corpus:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline_risk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q --cov=pipeline_risk --cov-report=term-missing"
asyncio_mode = "auto"

# Coverage gate is enforced per-module: chunker, parser, embedder, extractor.
[tool.coverage.report]
exclude_also = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
